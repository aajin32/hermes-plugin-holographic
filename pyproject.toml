[project]
name = "hermes-plugin-holographic"
version = "0.13.0"
description = "Hermes Agent memory provider plugin: holographic"
requires-python = ">=3.11"
license = { text = "MIT" }
# Installed into the Hermes venv by `hermes plugins install` / `enable` and re-applied after
# every `hermes update` (hermes-agent#113851). Keep upper bounds: Hermes pins its own deps exactly
# and refuses a plugin whose requirements cannot resolve against them.
dependencies = [
    "numpy>=1.26,<3",
    "snowballstemmer>=2.2,<4",  # word forms in search; pure Python. Polish needs 3.1+ (Hermes pins 3.1.1)
    "onnxruntime>=1.17,<2",    # local neural embeddings (optional at runtime, installed with the plugin)
    "transformers>=4.40,<6",   # tokenizer for the ONNX embedding model
    "optimum[onnxruntime]>=1.18,<3",  # loads the ONNX export of the embedding model
]

[tool.pytest.ini_options]
testpaths = ["tests"]
