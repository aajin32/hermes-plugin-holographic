[project]
name = "hermes-plugin-holographic"
version = "0.13.0"
description = "Hermes Agent memory provider plugin: holographic"
requires-python = ">=3.11"
license = { text = "MIT" }
# Installed into the Hermes venv by `hermes plugins install` / `enable` and re-applied after
# every `hermes update` (hermes-agent#113851). Keep upper bounds: Hermes pins its own deps exactly
# and refuses a plugin whose requirements cannot resolve against them.
dependencies = [
    "numpy>=1.26,<3",
    "snowballstemmer>=2.2,<4",  # word forms in search; pure Python. Polish needs 3.1+ (Hermes pins 3.1.1)
    # Local neural embeddings. onnxruntime alone runs the model on CPU; optimum is
    # deliberately NOT a dependency (it pulls torch and the CUDA stack, gigabytes,
    # for a model that runs fine here). Optional at run time: without the model
    # directory, search falls back to its lexical scoring.
    "onnxruntime>=1.17,<2",
    "transformers>=4.40,<6",  # tokenizer only (AutoTokenizer); no torch needed
]

[tool.pytest.ini_options]
testpaths = ["tests"]
